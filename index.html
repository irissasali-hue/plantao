<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Plantão — RPG de Medicina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d16;
    --pad: #2a2f45;
    --pad-hi: #3a4160;
    --pad-edge: #151827;
    --label: #c8d0f0;
    --a: #d84848;
    --b: #e0b030;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overscroll-behavior: none; }
  body {
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    font-family: "Pixelify Sans", monospace;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 256 / 224));
    aspect-ratio: 256 / 224;
    image-rendering: pixelated;
  }
  #pad, #name-field[hidden] { display: none; }

  /* ---------- controles de toque ---------- */
  body.touch { touch-action: none; }
  body.touch #app {
    position: relative; width: 100vw; height: 100vh; height: 100dvh;
    display: flex; align-items: center; justify-content: center;
  }
  body.touch #pad { display: block; position: absolute; inset: 0; pointer-events: none; }
  #pad > * { pointer-events: auto; position: absolute; touch-action: none; }

  #dpad {
    width: 148px; height: 148px; display: grid;
    grid-template: 1fr 1fr 1fr / 1fr 1fr 1fr; gap: 0;
  }
  #dpad span { background: var(--pad); border: 2px solid var(--pad-edge); }
  #dpad span.on { background: var(--pad-hi); }
  #dpad [data-dir="up"] { grid-area: 1 / 2; border-radius: 8px 8px 0 0; border-bottom: 0; }
  #dpad [data-dir="left"] { grid-area: 2 / 1; border-radius: 8px 0 0 8px; border-right: 0; }
  #dpad .hub { grid-area: 2 / 2; border: 0; background: var(--pad); }
  #dpad [data-dir="right"] { grid-area: 2 / 3; border-radius: 0 8px 8px 0; border-left: 0; }
  #dpad [data-dir="down"] { grid-area: 3 / 2; border-radius: 0 0 8px 8px; border-top: 0; }

  .btn {
    border: 3px solid var(--pad-edge); border-radius: 50%;
    width: 68px; height: 68px; padding: 0;
    font: 700 24px "Pixelify Sans", monospace; color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,.35);
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.25);
  }
  .btn.on { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); filter: brightness(1.15); }
  .btn.a { background: var(--a); }
  .btn.b { background: var(--b); }
  #ab { width: 156px; height: 120px; }
  #ab .a { position: absolute; right: 0; top: 0; }
  #ab .b { position: absolute; left: 0; bottom: 0; }

  #sys { display: flex; gap: 10px; }
  .pill {
    border: 2px solid var(--pad-edge); border-radius: 14px; background: var(--pad);
    color: var(--label); font: 700 13px "Pixelify Sans", monospace; letter-spacing: 1px;
    padding: 7px 14px; min-width: 44px;
  }
  .pill.on { background: var(--pad-hi); }

  /* Em pé: tela em cima, controle embaixo */
  @media (orientation: portrait) {
    body.touch #app { flex-direction: column; justify-content: flex-start; }
    body.touch canvas {
      width: min(100vw, calc(58dvh * 256 / 224));
      margin-top: env(safe-area-inset-top);
    }
    #dpad { left: 18px; bottom: calc(64px + env(safe-area-inset-bottom)); }
    #ab { right: 18px; bottom: calc(78px + env(safe-area-inset-bottom)); }
    #sys { left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); }
  }
  /* Deitado: tela no centro, controles nas laterais */
  @media (orientation: landscape) {
    body.touch canvas { width: min(calc(100vw - 340px), calc(100dvh * 256 / 224)); }
    #dpad { left: calc(14px + env(safe-area-inset-left)); bottom: 22px; }
    #ab { right: calc(14px + env(safe-area-inset-right)); bottom: 30px; }
    #sys { flex-direction: column; right: calc(18px + env(safe-area-inset-right)); top: 14px; }
  }
  @media (orientation: landscape) and (max-height: 340px) {
    #dpad { width: 124px; height: 124px; }
    .btn { width: 58px; height: 58px; }
    #ab { width: 132px; height: 104px; }
  }

  /* Campo de nome (abre o teclado do celular) */
  #name-field {
    position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 8px; padding: 10px;
    background: #1a2a7c; border: 2px solid #e8e8f0; border-radius: 6px;
  }
  #name-field input {
    width: 180px; font: 18px "Pixelify Sans", monospace; padding: 6px 8px;
    border: 2px solid #101828; border-radius: 4px; background: #f8f8f8; color: #101828;
  }
  #name-field button { font: 700 16px "Pixelify Sans", monospace; padding: 0 14px; }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="pad" aria-hidden="true">
    <div id="dpad">
      <span data-dir="up"></span><span data-dir="left"></span><span class="hub"></span>
      <span data-dir="right"></span><span data-dir="down"></span>
    </div>
    <div id="ab">
      <button class="btn b" data-key="back">B</button>
      <button class="btn a" data-key="ok">A</button>
    </div>
    <div id="sys">
      <button class="pill" data-key="menu">MENU</button>
      <button class="pill" data-key="mute">SOM</button>
      <button class="pill" id="btn-fullscreen">⛶</button>
    </div>
  </div>
</div>
<div id="name-field" hidden>
  <input type="text" maxlength="12" autocomplete="off" autocapitalize="words" enterkeyhint="done" placeholder="Seu nome">
  <button type="button">OK</button>
</div>
<!-- Conteúdo criativo: arte, casos, mapa e história -->
<script src="content/art.js"></script>
<script src="content/team.js"></script>
<script src="content/cases.js"></script>
<script src="content/world.js"></script>
<script src="content/maps.js"></script>
<script src="content/library.js"></script>
<script src="content/audio.js"></script>
<!-- Motor -->
<script src="js/input.js"></script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/touch.js"></script>
<script src="js/sprites.js"></script>
<script src="js/party.js"></script>
<script src="js/world.js"></script>
<script src="js/script.js"></script>
<script src="js/screens.js"></script>
<script src="js/versions.js"></script>
<script src="js/cards.js"></script>
<script src="js/battle.js"></script>
<script src="js/main.js"></script>
</body>
</html>
